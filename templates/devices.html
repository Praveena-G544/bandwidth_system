{% extends "base.html" %}{% block body %}<h1>Devices</h1>
<div class="box"><form class="row" method="post">
<select name="user_id">{% for u in users %}<option value="{{ u.user_id }}">{{ u.full_name }}</option>{% endfor %}</select>
<input name="device_name" placeholder="Device name" required>
<input name="mac_address" placeholder="AA:BB:CC:00:00:09" pattern="[0-9A-Fa-f:]{17}" required>
<button>Add device</button></form></div>
<div class="box"><table><tr><th>ID</th><th>Device</th><th>MAC address</th><th>Owner</th><th></th></tr>
{% for r in rows %}<tr><td>{{ r.device_id }}</td><td>{{ r.device_name }}</td><td>{{ r.mac_address }}</td><td>{{ r.full_name }}</td>
<td><form method="post" action="{{ url_for('delete_device', i=r.device_id) }}" onsubmit="return confirm('Delete this device?')"><button class="del">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
